<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="registration-container">

        <div class="registration-header">
            <h1>Student Registration</h1>
            <p>Manage Student Records Easily</p>
        </div>

        <div class="registration-form">

            <form method="POST">

                <div class="form-group">
                    <label for="student_name">Student Name</label>
                    <input type="text" id="student_name" name="student_name" placeholder="Enter Student Name" required>
                </div>

                <div class="form-group">
                    <label for="student_course">Student Course</label>
                    <input type="text" id="student_course" name="student_course" placeholder="Enter Student Course"
                        required>
                </div>

                <div class="form-group">
                    <label for="student_age">Student Age</label>
                    <input type="number" id="student_age" name="student_age" placeholder="Enter Student Age" required>
                </div>

                <div class="form-group">
                    <label for="student_city">Student City</label>
                    <input type="text" id="student_city" name="student_city" placeholder="Enter Student City" required>
                </div>

                <div class="form-group">
                    <label for="student_phone">Student Phone</label>
                    <input type="tel" id="student_phone" name="student_phone" placeholder="Enter Student Phone Number"
                        pattern="[0-9]{10}" maxlength="10" required>
                </div>

                <div class="form-group">
                    <label for="student_email">Student Email</label>
                    <input type="email" id="student_email" name="student_email" placeholder="Enter Student Email"
                        required>
                </div>

                <button type="submit" class="register-btn">
                    Register Student
                </button>

            </form>

            <a href="{{ url_for('dashboard') }}" class="back-link">
                ← Back to Dashboard
            </a>

        </div>

    </div>

</body>

</html>
