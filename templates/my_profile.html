<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container profile-container">

        <h2>My Profile</h2>
        <p>Manage Your Personal Account Details</p>

        <div class="profile-card">

            <div class="profile-header">

                <div class="profile-avatar">
    <img src="{{ url_for('static', filename='DP.jpg') }}"
         alt="Admin Profile">
</div>
                  <input type="file" name="profile_pic" id="profilePic" accept=".jpg,.jpeg,.png">

                <h3>{{ user.name or user.username }}</h3>

                <span class="profile-role">
                    {{ user.role|upper }}
                </span>

            </div>

            <form method="POST">
                <div class="profile-form">

                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" name="username" value="{{ user.username }}" required>
                    </div>

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="name" value="{{ user.name }}" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" value="{{ user.email }}">
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" name="phone" value="{{ user.phone }}">
                    </div>

                    <div class="form-group full-width">
                        <label>New Password</label>
                        <input type="password" name="password" placeholder="Leave blank to keep current password">
                    </div>

                </div>

                <div class="profile-buttons">

                    <button type="submit" class="profile-save-btn">
                        Update Profile
                    </button>

                    <a href="{{ url_for('dashboard') }}" class="profile-back-btn">
                        Back to Dashboard
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
