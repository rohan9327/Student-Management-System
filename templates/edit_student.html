<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="edit-user-body">

    <div class="edit-container">

        <div class="edit-header">
            <h2>Edit Student Details</h2>
            <p>Update registered student information</p>
        </div>

        <form method="POST"
              action="{{ url_for('edit_student', student_id=student.id) }}"
              class="edit-form">

            <label>Student Name</label>
            <input type="text" name="name"
                   value="{{ student.name }}" required>

            <label>Age</label>
            <input type="number" name="age"
                   value="{{ student.age }}" required>

            <label>City</label>
            <input type="text" name="city"
                   value="{{ student.city }}" required>

            <label>Phone</label>
            <input type="text" name="phone"
                   value="{{ student.phone }}" required>

            <label>Email</label>
            <input type="email" name="email"
                   value="{{ student.email }}" required>

            <label>Course</label>
            <input type="text" name="course"
                   value="{{ student.course }}" required>

                   {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <div class="alert {{ category }}">
            {{ message }}
        </div>
    {% endfor %}
{% endwith %}

            <button type="submit" class="update-btn">
                Update Student
            </button>

            <a href="{{ url_for('view_students') }}"
               class="back-link">
                Back to Students
            </a>

        </form>

    </div>

</body>
</html>
